<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baixe o app Acertos Club</title>
  <link rel="icon" href="assets/icon.png" type="image/png" />

  <!-- ✅ Redirecionamento via JavaScript (ignora bots) -->
  <script>
    const isBot = /bot|googlebot|crawler|spider|crawling/i.test(navigator.userAgent);
    if (!isBot) {
      window.location.href = "https://play.google.com/store/apps/details?id=com.acertosclub.app";
    }
  </script>

  <!-- ✅ Dados estruturados (SEO para o app) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Acertos Club",
    "operatingSystem": "ANDROID",
    "applicationCategory": "GameApplication",
    "url": "https://play.google.com/store/apps/details?id=com.acertosclub.app",
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1000"
    }
  }
  </script>
</head>
<body>
  <h1>Baixe o app Acertos Club</h1>
  <p>Conheça o aplicativo Acertos Club. A melhor plataforma de palpites, loterias, cassinos e jogo do bicho. Faça o download agora mesmo pela Google Play Store.</p>
  <p><a href="https://play.google.com/store/apps/details?id=com.acertosclub.app">Clique aqui para baixar o app</a>.</p>
</body>
</html>
